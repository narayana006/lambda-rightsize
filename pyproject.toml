[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lambda-rightsize"
version = "0.1.0"
description = "Suggest a memory size for each AWS Lambda function from exported REPORT log lines or CloudWatch Logs Insights CSV."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Narayana Vemburaj" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
lambda-rightsize = "lambda_rightsize.cli:main"

[tool.setuptools]
packages = ["lambda_rightsize"]

[tool.pytest.ini_options]
testpaths = ["tests"]
